<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lawal Abdulmaleeq | Full-stack Developer</title>
    <meta name="description" content="Portfolio of Lawal Abdulmaleeq, a full-stack developer building fast, accessible web apps with React and Django." />
    <meta name="theme-color" content="#f2f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121419" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <meta property="og:type" content="website" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
